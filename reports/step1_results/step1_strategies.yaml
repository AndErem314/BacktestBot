strategies:
  commodity_gold_conservative:
    asset_class: commodity
    description: Conservative Gold strategy with wider SL and higher TP targets
    enabled: true
    ichimoku_parameters:
      chikou_offset: 26
      kijun_period: 26
      senkou_b_period: 52
      senkou_offset: 26
      tenkan_period: 9
    macd_parameters:
      enabled: false
      fast: 12
      signal: 9
      slow: 26
    name: Gold Conservative - 6.5% SL / 15% TP
    position_sizing:
      fixed_size: 1000
      method: fixed
    psar_parameters:
      enabled: false
      max_step: 0.2
      step: 0.02
    risk_management:
      close_on_sell_signal: true
      max_position_size_pct: 100.0
      risk_per_trade_pct: 6.5
      stop_loss_pct: 6.5
      take_profit_pct: 15.0
      trailing_stop: false
    signal_conditions:
      buy_conditions:
      - PriceAboveCloud
      - TenkanAboveKijun
      - SpanAaboveSpanB
      - ChikouAboveCloud
      buy_logic: AND
      sell_conditions:
      - TenkanBelowKijun
      sell_logic: AND
    symbols:
    - GOLD
    timeframes:
    - 4h
    - 1d
  commodity_gold_psar_sensitive:
